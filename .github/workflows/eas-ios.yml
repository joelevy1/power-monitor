# EAS iOS builds — manual dispatch; every profile uses --auto-submit to TestFlight.
# Requires: EXPO_TOKEN, eas-build environment (optional approval gate).
#
# Push to master runs validate-ios.yml instead (free bundle + expo-doctor).

name: EAS iOS build (Boat Monitor)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS profile — run smoke before production
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - preview
          - production
          - production_xcode26

concurrency:
  group: eas-ios-boat-monitor
  cancel-in-progress: false

jobs:
  build:
    environment: eas-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boat_monitor_app
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      EAS_PROFILE: ${{ github.event.inputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: boat_monitor_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare smoke variant (fresh prebuild on EAS, no full ios/)
        if: ${{ github.event.inputs.profile == 'smoke' }}
        run: rm -rf ios

      - name: Verify Expo project is linked
        run: |
          set -euo pipefail
          node -e "
            const c = require('./app.json').expo;
            const id = c.extra && c.extra.eas && c.extra.eas.projectId;
            if (!id) { console.error('missing projectId'); process.exit(1); }
            console.log('EAS projectId:', id);
          "

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing EXPO_TOKEN"
            exit 1
          fi
          npx eas-cli@latest whoami

      - name: EAS Build (queue TestFlight submit for store profiles)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          LOG_FILE="$(mktemp)"
          SUBMIT_ARGS=(--auto-submit)
          set +e
          set -o pipefail
          npx eas-cli@latest build --platform ios --profile "$EAS_PROFILE" --non-interactive --no-wait "${SUBMIT_ARGS[@]}" 2>&1 | tee "$LOG_FILE"
          EXIT="${PIPESTATUS[0]}"
          set +o pipefail
          set -e
          if [ "$EXIT" -ne 0 ]; then
            echo "### eas build failed — log tail (last 120 lines)" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 "$LOG_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$EXIT"
          fi
          BUILD_URL="$(grep -Eo 'https://expo.dev/[^[:space:]]+' "$LOG_FILE" | tail -1 || true)"
          if [ -n "$BUILD_URL" ]; then
            echo "### EAS build queued (auto-submit to TestFlight when build finishes)" >> "$GITHUB_STEP_SUMMARY"
            echo "$BUILD_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
