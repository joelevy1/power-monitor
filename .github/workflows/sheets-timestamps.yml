# Converts ISO-text timestamp cells to Pacific date/time values until the
# live Apps Script Web App is redeployed with receiver_version >= 2.
name: Fix sheet timestamps

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r boat_monitor/requirements-sheets.txt

      - name: Write service account key
        env:
          JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          BOAT_JSON: ${{ secrets.BOAT_MONITOR_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${BOAT_JSON:-}" ]; then
            printf '%s' "$BOAT_JSON" > /tmp/sa.json
          elif [ -n "${B64:-}" ]; then
            echo "$B64" | base64 -d > /tmp/sa.json
          elif [ -n "${JSON:-}" ]; then
            printf '%s' "$JSON" > /tmp/sa.json
          else
            echo "::error::Set BOAT_MONITOR_GOOGLE_SERVICE_ACCOUNT_JSON or GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          echo "BOAT_MONITOR_GOOGLE_SERVICE_ACCOUNT_JSON=$(cat /tmp/sa.json)" >> "$GITHUB_ENV"
          echo "GOOGLE_SERVICE_ACCOUNT_JSON=$(cat /tmp/sa.json)" >> "$GITHUB_ENV"

      - name: Format timestamps and repair legacy rows
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          YOUR_SPREADSHEET_ID: ${{ secrets.YOUR_SPREADSHEET_ID }}
        run: python3 boat_monitor/sheets_bootstrap.py
