name: Bootstrap Google Sheets

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r boat_monitor/requirements-sheets.txt

      - name: Write service account key
        env:
          JSON: ${{ secrets.BOAT_MONITOR_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${JSON:-}" ]; then
            printf '%s' "$JSON" > /tmp/sa.json
          else
            echo "::error::Set BOAT_MONITOR_GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"

      - name: Bootstrap tabs and headers
        run: python3 boat_monitor/sheets_bootstrap.py
