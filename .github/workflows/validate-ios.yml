# Free checks before spending EAS credits (no iPhone required).
# macOS job compiles the native iOS target (simulator) — closest thing to "will it launch?"
# without EAS. It does NOT prove TestFlight behavior; use profile "smoke" on EAS for that.

name: Validate iOS app (Boat Monitor)

on:
  push:
    branches:
      - master
    paths:
      - 'boat_monitor_app/**'
      - '.github/workflows/validate-ios.yml'
  pull_request:
    paths:
      - 'boat_monitor_app/**'
  workflow_dispatch:

jobs:
  validate-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boat_monitor_app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: boat_monitor_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        continue-on-error: true
        run: npx expo-doctor@latest

      - name: Bundle iOS JS (full app)
        env:
          EXPO_PUBLIC_APP_VARIANT: full
        run: npx expo export --platform ios --output-dir /tmp/expo-export-full

      - name: Bundle iOS JS (smoke app)
        env:
          EXPO_PUBLIC_APP_VARIANT: smoke
        run: npx expo export --platform ios --output-dir /tmp/expo-export-smoke

  ios-native-compile:
    runs-on: macos-14
    defaults:
      run:
        working-directory: boat_monitor_app
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            use_committed_ios: true
          - variant: smoke
            use_committed_ios: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: boat_monitor_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS (smoke only)
        if: matrix.use_committed_ios == false
        env:
          EXPO_PUBLIC_APP_VARIANT: smoke
        run: npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods install
        run: |
          cd ios
          pod install --repo-update

      - name: Compile for iOS Simulator
        run: |
          set -euo pipefail
          # The smoke variant's app.config.js renames the app to "Boat
          # Monitor Smoke" (isSmoke check), so expo prebuild generates a
          # differently-named ios/*.xcworkspace than the committed
          # "BoatMonitor.xcworkspace" this used to hardcode -- that name
          # only exists for the full variant's committed ios/. Resolve it
          # from whatever prebuild/checkout actually produced instead.
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          if [ -z "$workspace" ]; then
            echo "::error::No .xcworkspace found under ios/"
            exit 1
          fi
          # Query Xcode for the real scheme name instead of assuming it
          # matches the workspace filename -- safer than guessing given
          # this can't be verified without a macOS/Xcode environment.
          scheme=$(xcodebuild -list -workspace "$workspace" 2>/dev/null | awk '/Schemes:/{flag=1; next} flag && NF{print; exit}' | xargs)
          if [ -z "$scheme" ]; then
            echo "::error::Could not determine a scheme from $workspace"
            xcodebuild -list -workspace "$workspace" || true
            exit 1
          fi
          echo "Using workspace: $workspace (scheme: $scheme)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
